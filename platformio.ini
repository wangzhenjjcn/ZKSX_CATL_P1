; XIAO ESP32-S3 Sense: sensor UART + PDM mic + switches -> USB CDC mux
; Build / flash: pio run -t upload
; USB CDC baud is ignored; do not open Serial Monitor while tools/usb_mux_dump.py is running.

[env:seeed_xiao_esp32s3]
; Official registry package (Arduino-ESP32 2.x). For Arduino 3.x / ESP_I2S:
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
platform = espressif32 @ 7.1.3
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
